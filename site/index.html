<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Big+Shoulders+Display:wght@700;800;900&family=Source+Sans+3:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme:light;
    --ink:#17140f; --ink-2:#2a2622; --text:#1f1c18; --text-2:#5d5a55; --text-3:#8a8680;
    --bg:#f3f2ef; --paper:#ffffff; --alu:#e6e7e8; --line:#dedcd7;
    --gold:#b8862a; --gold-2:#e2b24a; --yellow:#ffd93b;
    --green:#2f7a4f; --green-soft:#e2f1e8; --red:#b93d12; --red-soft:#fbe7df; --amber:#9a6a0c; --amber-soft:#fbf1d8;
    --blue:#2d5f8a; --blue-soft:#e3edf6;
    --display:"Big Shoulders Display","Arial Narrow",Impact,sans-serif;
    --body:"Source Sans 3",system-ui,-apple-system,"Segoe UI",sans-serif;
    --mbar-h:0px; --hdr:74px;
  }
  *{box-sizing:border-box}
  [hidden]{display:none!important}
  html{scroll-behavior:smooth}
  body{margin:0;background:var(--bg);color:var(--text);font:17px/1.55 var(--body);-webkit-font-smoothing:antialiased;overflow-x:hidden}
  a{color:inherit}
  img{max-width:100%;display:block}
  button{font:inherit;color:inherit}
  .wrap{max-width:1180px;margin:0 auto;padding-inline:20px}
  @media (max-width:520px){.wrap{padding-inline:16px}}
  h1,h2,h3{font-family:var(--display);text-transform:uppercase;margin:0;line-height:.95;letter-spacing:.005em;text-wrap:balance}
  h1{font-size:clamp(2.6rem,6vw,4.2rem);font-weight:900}
  h2{font-size:clamp(2.2rem,5vw,3.4rem);font-weight:900}
  h3{font-size:1.6rem;font-weight:800}
  .eyebrow{font:700 .78rem/1 var(--body);letter-spacing:.18em;text-transform:uppercase;color:var(--gold)}
  .lede{color:var(--text-2);font-size:1.1rem;max-width:58ch;margin:14px 0 0}
  .muted{color:var(--text-3)}
  .sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
  .concept{background:repeating-linear-gradient(45deg,#221f1b 0 12px,#1b1915 12px 24px);color:#cfc9bf;font-size:.82rem;text-align:center;padding:7px 14px}
  .concept b{color:var(--gold-2)}
  [id]{scroll-margin-top:96px}

  .btn{display:inline-flex;align-items:center;justify-content:center;gap:.5em;font:800 1.05rem/1 var(--display);letter-spacing:.08em;text-transform:uppercase;text-decoration:none;padding:15px 24px;border-radius:6px;border:2px solid transparent;cursor:pointer;white-space:nowrap;transition:transform .15s,background .2s}
  .btn:hover{transform:translateY(-2px)}
  .btn:disabled{opacity:.55;cursor:not-allowed;transform:none}
  .btn:focus-visible,.chip:focus-visible,.pick:focus-visible,.opt:focus-visible,a:focus-visible,button:focus-visible{outline:3px solid var(--gold-2);outline-offset:2px}
  .btn-gold{background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--ink)}
  .btn-dark{background:var(--ink);color:#fff}
  .btn-line{border-color:var(--ink);color:var(--ink);background:transparent}
  .btn-line-light{border-color:rgba(255,255,255,.4);color:#fff;background:transparent}
  .btn.sm{padding:10px 14px;font-size:.92rem}
  .btn.xs{padding:7px 10px;font-size:.82rem;border-width:1.5px}
  .btn svg{width:1.05em;height:1.05em;flex:none}
  .link{background:none;border:0;padding:0;color:var(--gold);font-weight:700;cursor:pointer;text-decoration:underline;text-underline-offset:3px}

  /* utility bar */
  .ubar{background:#0f0d0a;color:#b9b2a7;font-size:.86rem}
  .ubar .wrap{display:flex;gap:8px 22px;align-items:center;justify-content:center;flex-wrap:wrap;padding-block:7px}
  .ubar a{text-decoration:none;color:#fff;font-weight:700}
  .ubar span{display:inline-flex;align-items:center;gap:6px}
  .ubar svg{width:14px;height:14px;color:var(--gold-2)}
  @media (max-width:700px){.ubar .u-addr,.ubar .u-hours{display:none}}

  /* header */
  header.site{position:sticky;top:0;z-index:40;background:var(--ink);border-bottom:3px solid var(--gold)}
  .nav{display:flex;align-items:center;gap:18px;height:var(--hdr)}
  .nav .logo{flex:none}
  .nav .logo img{height:48px;width:auto}
  .nav-links{display:flex;gap:6px;margin-left:6px}
  .menu{position:relative}
  .menu>button,.menu>a{background:none;border:0;color:#d9d3c8;font-weight:600;font-size:.95rem;display:inline-flex;align-items:center;gap:5px;cursor:pointer;padding:10px 10px;text-decoration:none;border-radius:6px}
  .menu>button:hover,.menu.open>button,.menu>button[aria-current="true"],.menu>a[aria-current="true"]{color:#fff;background:#24201b}
  .nav-about{color:var(--gold-2)!important;font-weight:700}
  .menu>button svg{width:12px;height:12px;transition:transform .15s}
  .menu.open>button svg{transform:rotate(180deg)}
  .dd{position:absolute;top:calc(100% + 6px);left:0;min-width:250px;background:var(--paper);border-radius:12px;box-shadow:0 18px 50px rgba(0,0,0,.28);padding:8px;display:none;z-index:5}
  .dd::before{content:"";position:absolute;left:0;right:0;top:-8px;height:8px}
  .menu.open .dd{display:block}
  @media (hover:hover) and (min-width:941px){.menu:hover .dd{display:block}.menu:hover>button svg{transform:rotate(180deg)}}
  .dd a{display:block;padding:10px 12px;border-radius:8px;color:var(--text);text-decoration:none;font-weight:700;font-size:.95rem}
  .dd a small{display:block;color:var(--text-3);font-weight:400;font-size:.82rem}
  .dd a:hover,.dd a:focus-visible{background:var(--bg)}
  .hsearch{position:relative;flex:1;max-width:260px;margin-left:auto}
  .hsearch input{width:100%;background:#24201b;border:1px solid #4a443c;color:#fff;border-radius:999px;padding:9px 14px 9px 36px;font-size:.92rem}
  .hsearch input::placeholder{color:#a9a298}
  .hsearch input:focus{outline:none;border-color:var(--gold-2);background:#2c2720}
  .hsearch svg{position:absolute;left:12px;top:50%;transform:translateY(-50%);width:16px;height:16px;color:#a9a298;pointer-events:none}
  .nav-right{display:flex;align-items:center;gap:10px;flex:none}
  .nav-right .btn{padding:10px 14px;font-size:.92rem}
  .uchip{display:inline-flex;align-items:center;gap:8px;background:#24201b;border:1px solid #4a443c;color:#fff;border-radius:999px;padding:4px 12px 4px 4px;cursor:pointer;font-size:.86rem;font-weight:600}
  .uchip .av{width:30px;height:30px;font-size:.8rem}
  .uchip small{display:block;color:#a9a298;font-size:.72rem;font-weight:600;line-height:1}
  .uchip span{line-height:1.15;text-align:left}
  .menu .dd.right{left:auto;right:0}
  .av{display:inline-grid;place-items:center;flex:none;width:40px;height:40px;border-radius:50%;background:linear-gradient(180deg,var(--gold-2),var(--gold));color:var(--ink);font:900 1rem/1 var(--display);letter-spacing:.04em}
  .av.dark{background:var(--ink);color:var(--yellow)}
  .burger{display:none;background:none;border:1px solid #4a443c;color:#fff;border-radius:8px;width:44px;height:44px;place-items:center;cursor:pointer}
  .burger svg{width:22px;height:22px}
  @media (max-width:1100px){.hsearch{max-width:180px}.nav-links{gap:0}}
  @media (max-width:940px){.nav-links,.hsearch{display:none}.burger{display:inline-grid}.nav-right{margin-left:auto}}
  @media (max-width:560px){.nav .logo img{height:40px}.nav-right .acct-slot{display:none}.nav-right .btn-tessa svg{display:none}.nav-right .btn-tessa{padding:10px 11px;font-size:.88rem}.nav{gap:10px}}

  /* drawer */
  .drawer-bg{position:fixed;inset:0;background:rgba(15,13,10,.55);z-index:80}
  .drawer{position:fixed;top:0;right:0;bottom:0;width:min(360px,100%);background:var(--paper);z-index:81;overflow-y:auto;padding:18px 18px 40px;box-shadow:-20px 0 50px rgba(0,0,0,.25)}
  .drawer .dhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
  .drawer h4{font:800 .78rem/1 var(--body);letter-spacing:.16em;text-transform:uppercase;color:var(--gold);margin:22px 0 6px}
  .drawer a{display:block;padding:11px 4px;border-bottom:1px solid var(--line);text-decoration:none;font-weight:700}
  .drawer .dsearch input{padding-left:14px}
  .xbtn{background:var(--bg);border:0;border-radius:50%;width:38px;height:38px;display:grid;place-items:center;cursor:pointer}
  .xbtn svg{width:18px;height:18px}

  /* forms */
  label{display:block;font-size:.82rem;font-weight:700;color:var(--text-2);margin-bottom:6px}
  input,select,textarea{width:100%;font:inherit;font-size:1rem;color:var(--text);background:#faf9f7;border:1px solid var(--line);border-radius:8px;padding:12px 13px}
  input:focus,select:focus,textarea:focus{outline:none;border-color:var(--gold);background:#fff}
  input.bad,select.bad{border-color:var(--red)!important}
  textarea{min-height:90px;resize:vertical}
  input[type=checkbox],input[type=radio]{width:auto;accent-color:var(--gold)}
  input[type=range]{padding:0;accent-color:var(--gold);background:none;border:0}

  /* hero */
  .hero{background:var(--paper);position:relative;overflow:hidden;border-bottom:1px solid var(--line)}
  .hero::after{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;background:linear-gradient(180deg,transparent,#efeeeb);pointer-events:none}
  .hero-grid{display:grid;grid-template-columns:1fr 1fr;gap:30px;align-items:center;padding-block:52px 44px;position:relative;z-index:1}
  .hero h1{font-size:clamp(3.4rem,8vw,6.2rem);font-weight:900;color:var(--ink)}
  .hero h1 span{display:block;background:linear-gradient(180deg,var(--gold-2) 10%,var(--gold) 70%,#8a6118);-webkit-background-clip:text;background-clip:text;color:transparent}
  .hero .lede{font-size:1.18rem}
  .hero-ask{display:flex;align-items:center;gap:8px;margin-top:26px;background:var(--paper);border:2px solid var(--ink);border-radius:12px;padding:6px 6px 6px 10px;box-shadow:0 12px 30px rgba(23,20,15,.1);max-width:560px}
  .hero-ask input{border:0;background:transparent;padding:10px 4px;font-size:1.05rem;min-width:0}
  .hero-ask input:focus{background:transparent}
  .hero-ask .btn{padding:12px 16px}
  .hero-try{display:flex;flex-wrap:wrap;gap:6px;margin-top:10px;font-size:.86rem;color:var(--text-3);align-items:center}
  .hero-try button{background:var(--bg);border:1px solid var(--line);border-radius:999px;padding:5px 11px;font-size:.84rem;cursor:pointer;color:var(--text-2)}
  .hero-try button:hover{border-color:var(--gold)}
  .hero-ctas{display:flex;flex-wrap:wrap;gap:12px;margin-top:22px}
  .trustrow{display:flex;flex-wrap:wrap;gap:8px 18px;margin-top:22px;font-size:.92rem;color:var(--text-2)}
  .trustrow span{display:inline-flex;align-items:center;gap:7px}

    hold: { cls: "hold", label: "On hold", pill: "amber" }, sold: { cls: "sold", label: "Sold", pill: "red" } })[t.status] || { cls: "", label: t.status, pill: "" };
}
function monthly(price, o = {}) {
  const f = DATA.finance; const apr = o.apr != null ? o.apr : f.apr; const n = o.term || f.term;
  const down = o.down != null ? o.down : price * f.downPct / 100; const P = Math.max(price - down, 0); const r = apr / 1200;
  return r ? P * r / (1 - Math.pow(1 + r, -n)) : P / n;
}

function toggleCompare(id, force) {

function addLead(o) {
  const lead = Object.assign({ id: nextId("L"), stage: "New", created: new Date().toISOString() }, o);
  S.leads.unshift(lead); save(); return lead;
}
function createHold(t, name, phone) {
  const h = { id: nextId("H"), userId: S.user && !isStaff() ? S.user : (S.user ? null : "guest"), trailerId: t.id, name, phone,
    created: new Date().toISOString(), expires: new Date(Date.now() + 2 * DAY).toISOString(), status: "Active", prev: t.status };
  if (!S.user) h.userId = "guest";
  S.holds.unshift(h); t.status = "hold";
  addLead({ name, phone, interest: tname(t) + " (hold " + t.id + ")", source: "Hold" });
  save(); return h;
}
function releaseHold(id) {
  const h = S.holds.find(x => x.id === id); if (!h) return;
  h.status = "Released"; const t = unit(h.trailerId);
  if (t && t.status === "hold") t.status = h.prev && h.prev !== "hold" ? h.prev : "lot";
  save();
}
function quoteCalc(t, addonIds) {
  const items = [{ label: tname(t) + " · Stock " + t.id, amt: t.price }];
  addonIds.forEach(id => { const a = DATA.addons.find(x => x.id === id); if (a) items.push({ label: a.label, amt: a.price }); });
  const sub = items.reduce((s, i) => s + i.amt, 0); const f = DATA.fees;
  const tax = Math.round((sub + f.doc) * f.taxRate);
  return { items, sub, doc: f.doc, tax, tag: f.titleTag, total: sub + f.doc + tax + f.titleTag };
}
function quoteTable(q) {
  const t = unit(q.trailerId); if (!t) return "";
  const c = quoteCalc(t, q.addons);
  return `<table class="qitems">${c.items.map(i => `<tr><td>${esc(i.label)}</td><td>${money(i.amt)}</td></tr>`).join("")}
    <tr class="sub"><td>Doc fee (sample)</td><td>${money(c.doc)}</td></tr>
    <tr class="sub"><td>${esc(DATA.fees.taxLabel)}</td><td>${money(c.tax)}</td></tr>
    <tr class="sub"><td>Title and tag (sample)</td><td>${money(c.tag)}</td></tr>
    <tr class="tot"><td>Out the door</td><td>${money(c.total)}</td></tr></table>`;
}
function createQuote(t, addons, name, phone) {
  const q = { id: nextId("Q"), userId: S.user && !isStaff() ? S.user : (S.user ? null : "guest"), name, phone, trailerId: t.id, addons, created: new Date().toISOString(), status: "Sent" };
  S.quotes.unshift(q);
  const lead = S.leads.find(l => l.name === name && l.stage !== "Won" && l.stage !== "Lost");
  if (lead) { lead.stage = "Quoted"; lead.interest = tname(t); } else addLead({ name, phone, interest: tname(t), source: "Quote", stage: "Quoted" });
  save(); return q;
}
function partsTotal(items) { return items.reduce((s, [id, q]) => { const p = DATA.parts.find(x => x.id === id); return s + (p ? p.price * q : 0); }, 0); }
function createPartsOrder(items, name, phone) {
  const o = { id: nextId("PO"), userId: S.user && !isStaff() ? S.user : "guest", name, phone, items, created: new Date().toISOString(), status: "Ordered" };
  S.partsOrders.unshift(o); save(); return o;
}

let demoTimer = null;
function startDemoChat() {
  const log = $("#demoLog"), typed = $("#demoTyped"); if (!log) return;
  clearTimeout(demoTimer);
  /* a scripted exchange for the animation only; no weights, ratings or verdicts, Andy on Stammer does the real answering */
  const q = "I've got a Bobcat T66 and a 2022 F-250. What should I be looking at?";
  const answer = `<p>A split tilt is the usual home for a compact track loader. It tilts to the ground, so you drive straight on with no ramps to lift.</p><p>Tell me the operating weight with the bucket on and I'll confirm the fit and what to check on your F-250. Then Matt sends your quote the same business day.</p>`;
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const bubble = (cls, html) => { const d = document.createElement("div"); d.className = "msg " + cls; d.innerHTML = html; log.appendChild(d); return d; };
  function run() {
    if (!document.body.contains(log)) return;
    log.innerHTML = ""; typed.textContent = "";
    if (reduce) { bubble("me", esc(q)); bubble("bot wide", answer); return; }
    let i = 0;
    (function type() {
      if (!document.body.contains(log)) return;
      typed.textContent = q.slice(0, ++i);
      if (i < q.length) { demoTimer = setTimeout(type, 34); return; }
      demoTimer = setTimeout(() => {
        typed.textContent = ""; bubble("me", esc(q));
        const dots = bubble("bot", '<span class="typing"><i></i><i></i><i></i></span>'); dots.style.padding = "0";
        demoTimer = setTimeout(() => { dots.remove(); bubble("bot wide", answer); demoTimer = setTimeout(run, 7000); }, 1500);
      }, 450);
    })();
  }
  if ("IntersectionObserver" in window) {
    const io = new IntersectionObserver(es => { if (es[0].isIntersecting) { io.disconnect(); run(); } }, { threshold: .3 });
    io.observe(log);
  } else run();
}

/* ---------- flair: reveal on scroll, counters, lightbox ---------- */
function enhance() {
  const reduce = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const rv = $$(".rv");
  if (reduce || !("IntersectionObserver" in window)) rv.forEach(e => e.classList.add("in"));
  else { const io = new IntersectionObserver(es => es.forEach(x => { if (x.isIntersecting) { x.target.classList.add("in"); io.unobserve(x.target); } }), { threshold: .15 }); rv.forEach(e => io.observe(e)); }
  $$("[data-count]").forEach(el => {
    const end = +el.dataset.count; if (reduce || !end) return;
    const t0 = performance.now(), dur = 900;
    const step = now => { const p = Math.min(1, (now - t0) / dur); el.textContent = Math.round(end * (1 - Math.pow(1 - p, 3))); if (p < 1) requestAnimationFrame(step); };
    requestAnimationFrame(step);
  });
}
let lbIndex = 0;
function openLightbox(i) {

function parseMoney(s, k) { let v = parseFloat(String(s).replace(/[$,\s]/g, "")); if (k || (v < 100 && /k/i.test(s))) v *= 1000; return Math.round(v); }

  const stop = ["the", "a", "an", "our", "unit", "units", "trailer", "trailers", "one", "new", "price", "of", "on", "that", "this", "timpte", "s", "to"];

}

    const model = "Timpte " + name.replace(/\b\w/g, c => c.toUpperCase()).replace(/\bUtv\b/, "UTV");

  }
  if (/how|lot|status|summary|look|numbers|today/.test(t)) {
    const lot = onLot(); const val = lot.reduce((s, x) => s + x.price, 0); const old = lot.filter(x => (Date.now() - new Date(x.added)) / DAY > 60);

  }

  updateChrome(); refreshHearts(); closeMenus(); closeDrawer(); enhance();
  if (keepScroll) window.scrollTo(0, y);
  else if (route.q.s) setTimeout(() => { const el = document.getElementById(route.q.s) || (route.q.s === "watch" ? document.querySelector(".vid") : null); if (el) el.scrollIntoView({ behavior: prev === route.name ? "smooth" : "auto" }); }, 30);
  else window.scrollTo(0, 0);
}
function rerender() { render(true); }

document.addEventListener("click", e => {
  const menuBtn = e.target.closest(".menu > button");
  if (menuBtn) { const m = menuBtn.parentNode; const open = !m.classList.contains("open"); closeMenus(m); m.classList.toggle("open", open); menuBtn.setAttribute("aria-expanded", open); return; }
  if (!e.target.closest(".menu")) closeMenus();
  const lb = e.target.closest("[data-lb]"); if (lb) { e.preventDefault(); openLightbox(+lb.dataset.lb); return; }
  const el = e.target.closest("[data-act]"); if (!el) return;
  const a = el.dataset.act, id = el.dataset.id;
  if (el.tagName === "SELECT" || (el.tagName === "INPUT" && el.type !== "checkbox")) return;
  switch (a) {
    case "save": e.preventDefault(); toggleSave(id); break;
    case "lb-prev": openLightbox(lbIndex - 1); break;
    case "lb-next": openLightbox(lbIndex + 1); break;
    case "lb-close": $("#lightbox").close(); break;
    case "cmp-toggle": toggleCompare(id); break;
    case "cmp-btn": toggleCompare(id); break;
    case "cmp-remove": toggleCompare(id); render(true); break;
    case "cmp-clear": S.compare = []; save(); render(true); break;
    case "cmp-starter": S.compare = ["TT-0155", "TT-0160"]; save(); render(true); break;
    case "hold": e.preventDefault(); holdModal(id); break;
    case "quote": quoteModal(id); break;
    case "ask": { const t = unit(id); openChat(t ? `Tell me about the ${tname(t)}, stock ${t.id}` : "", el); break; }
    case "quote-model": closeModal(); location.hash = "#/home?s=quote&m=" + encodeURIComponent(el.dataset.model || ""); break;
    case "tessa-open": e.preventDefault(); closeDrawer(); openChat("", el); break;
    case "tessa-close": closeChat(); break;
    case "tessa-reset": resetChat(); break;
    case "say": {
      const s = el.dataset.say;
      userSays(s); break;
    }
    case "signin-open": e.preventDefault(); closeMenus(); closeDrawer(); signinModal(); break;
    case "as": signIn(el.dataset.user); break;
    case "signout": e.preventDefault(); { const n = me() ? me().name : ""; S.user = null; save(); chat.booted = false; chat.ctx = {}; render(true); toast(`Signed out${n ? " of " + esc(n) : ""}.`); } break;
    case "burger": openDrawer(); break;
    case "drawer-close": closeDrawer(); break;
    case "modal-close": closeModal(); break;
    case "reset": resetDemo(); break;
    case "inv-type": inv.type = el.dataset.type; renderInvGrid(); break;
    case "inv-clear": inv.type = "all"; inv.q = ""; $$("[data-search]").forEach(i => i.value = ""); renderInvGrid(); break;
    case "line-f": { const f = el.dataset.f; $$("[data-act=line-f]").forEach(x => x.setAttribute("aria-pressed", x === el)); $$(".model").forEach(m => { m.hidden = !(f === "all" || (" " + m.dataset.cat + " ").includes(" " + f + " ")); }); break; }
    case "f-cat": finder.cat = el.dataset.k; renderFinder(); break;
    case "f-restart": finder.cat = null; renderFinder(); break;
    case "cart-add": { const c = S.cart.find(x => x[0] === id); if (c) c[1]++; else S.cart.push([id, 1]); save(); renderCart(); toast("Added to your parts order."); break; }
    case "cart-qty": { const c = S.cart.find(x => x[0] === id); if (c) { c[1] += +el.dataset.d; if (c[1] < 1) S.cart = S.cart.filter(x => x[0] !== id); } save(); renderCart(); break; }
    case "parts-cat": partsUI.cat = el.dataset.c; $$("[data-act=parts-cat]").forEach(x => x.setAttribute("aria-pressed", x === el)); renderParts(); break;
    case "parts-fit": partsUI.fit = el.checked; renderParts(); break;
    case "fin-term": fin.term = +el.dataset.n; $$("[data-act=fin-term]").forEach(x => x.setAttribute("aria-pressed", x === el)); renderCalc(); break;
    case "release": releaseHold(id); render(true); toast("Hold released. The unit is back on the lot."); break;
    case "doc": toast(`Sample: “${esc(el.dataset.n)}” would open as a PDF here.`); break;
    case "adm-tab": adm.tab = el.dataset.k; renderAdminMain(); break;
    case "adm-add": openAddUnit(); break;
    case "adm-sold": setStatus(id, "sold"); renderAdminMain([id]); renderKpis(); toast(`${id} marked sold.`); break;
    case "adm-say": adminSay(el.dataset.say); break;
    case "adm-confirm": adminConfirm(el.dataset.k, true); break;
    case "adm-cancel": adminConfirm(el.dataset.k, false); break;
    case "sync": syncSpecs(); break;
  }
});
function signIn(id, keep) {
  S.user = id; save(); closeModal(); closeDrawer();
  chat.booted = false; chat.ctx = {}; $("#tzLog").innerHTML = ""; setChips([]);
  const p = persona(id); toast(`Signed in as ${esc(p.name)} · ${esc(p.title)}`);
  if (keep) { openChat(); return render(true); }
  const target = p.role === "customer" ? "#/account" : "#/admin";
  if (location.hash === target) render(); else location.hash = target;
}
document.addEventListener("change", e => {
  const el = e.target;
  if (el.dataset.act === "cmp-add" && el.value) { toggleCompare(el.value); render(true); return; }
  if (el.dataset.act === "inv-sort") { inv.sort = el.value; renderInvGrid(); return; }
  if (el.dataset.act === "fin-tr") { const t = unit(el.value); fin.id = el.value; if (t) { fin.price = t.price; fin.down = Math.round(t.price * DATA.finance.downPct / 100); $("#fPrice").value = fin.price; $("#fDown").value = fin.down; } renderCalc(); return; }
  if (el.dataset.edit) {
    const t = unit(el.dataset.id);
    if (el.dataset.edit === "price") { const v = Math.round(+el.value); if (v > 0 && v !== t.price) { setPrice([t.id], v); toast(`${t.id} now ${money(v)}.`); } }
    else { setStatus(t.id, el.value); toast(`${t.id}: ${statusInfo(t).label}.`); }
    renderAdminMain([t.id]); renderKpis(); return;
  }
  if (el.dataset.adm) {
    const v = el.value, id = el.dataset.id;
    if (el.dataset.adm === "lead") return setLeadStage(id, v);
    const coll = { quote: S.quotes, parts: S.partsOrders, ticket: S.tickets, hold: S.holds }[el.dataset.adm];
    const r = coll.find(x => x.id === id); if (!r) return;
    if (el.dataset.adm === "hold" && v === "Released") releaseHold(id); else r.status = v;
    if (el.dataset.adm === "hold" && v === "Converted") { const t = unit(r.trailerId); if (t) t.status = "sold"; }
    logChange(`${id} → <b>${esc(v)}</b>`); save(); renderAdminMain(); renderKpis(); toast(`${id} set to ${esc(v)}.`);
  }
});
document.addEventListener("input", e => {
  const el = e.target;
  if (el.matches("[data-search]")) {
    inv.q = el.value;
    $$("[data-search]").forEach(i => { if (i !== el) i.value = el.value; });
    if (route.name !== "inventory") {
      inv.type = "all";
      history.pushState(null, "", "#/inventory"); render();
      if (el.isConnected) el.focus(); else { const q = $("#invQ"); if (q) { q.focus(); q.setSelectionRange(q.value.length, q.value.length); } }
    }
    else renderInvGrid();
  }
  if (el.dataset.act === "parts-q") { partsUI.q = el.value; renderParts(); }
  if (el.dataset.fin) { fin[el.dataset.fin] = +el.value || 0; if (el.dataset.fin !== "apr") { fin.id = ""; const s = $("#fTr"); if (s) s.value = ""; } renderCalc(); }
});
document.addEventListener("submit", e => { const f = e.target; const k = f.dataset.form; if (!k || !FORMS[k]) return; e.preventDefault(); FORMS[k](f); });
document.addEventListener("keydown", e => {
  const lbd = $("#lightbox"); if (lbd && lbd.open) { if (e.key === "ArrowLeft") openLightbox(lbIndex - 1); if (e.key === "ArrowRight") openLightbox(lbIndex + 1); return; }
  if (e.key !== "Escape") return;
  if ($("#modal")) closeModal(); else if ($("#drawer")) closeDrawer(); else if ($(".menu.open")) closeMenus(); else if (!$("#tzPanel").hidden) closeChat();
});
function setMbar() { const m = $(".mbar"); const h = m && getComputedStyle(m).display !== "none" ? m.offsetHeight : 0; document.documentElement.style.setProperty("--mbar-h", h + "px"); }
window.addEventListener("resize", setMbar);
window.addEventListener("hashchange", () => render());

    <div class="nav-right"><button class="btn btn-gold btn-tessa" data-act="tessa-open">${ICON.spark}<span>Ask ${A}</span></button><div class="acct-slot" id="acctSlot"></div>

</script>
